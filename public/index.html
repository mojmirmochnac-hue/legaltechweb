<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kontaktný formulár</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
      form { display: grid; gap: 0.75rem; }
      input, textarea, button { padding: 0.65rem; font-size: 1rem; }
      button { cursor: pointer; }
      #status { min-height: 1.25rem; }
    </style>
  </head>
  <body>
    <h1>Kontaktný formulár</h1>
    <form id="contact-form">
      <input name="name" placeholder="Meno" required />
      <input name="email" placeholder="Email" type="email" required />
      <textarea name="message" placeholder="Správa" rows="6" required></textarea>
      <button type="submit">Odoslať</button>
    </form>
    <p id="status"></p>

    <script>
      const form = document.getElementById('contact-form');
      const status = document.getElementById('status');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        status.textContent = 'Odosielam...';

        const payload = Object.fromEntries(new FormData(form));

        const response = await fetch('/api/contact', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (response.ok) {
          status.textContent = 'Formulár bol odoslaný.';
          form.reset();
        } else {
          status.textContent = result.error || 'Chyba pri odoslaní.';
        }
      });
    </script>
  </body>
</html>
